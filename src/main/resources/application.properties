spring.application.name=LP2_T2_Hartmann_Patricio

# Server configuration
server.port=8082

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/database_t2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=mysql

# Locale configuration
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
